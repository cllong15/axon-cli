version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: axon
    main: .
    binary: axon
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
