name: CI

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]
jobs:
    test:
      name: Build & Test
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
        - name: Set up go
          uses: actions/setup-go@v5
          with:
            go-version: '1.26.x'
            cache: true
        - name: Verify dependencies
          run: go mod verify

        - name: Run static analysis (go vet)
          run: go vet ./...
        - name: Run unit tests
          run: go test -v -cover ./...
        - name: Build binary
          run: go build -v .